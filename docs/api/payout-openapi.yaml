openapi: 3.1.0
info:
  title: FiatBridge Payout API
  version: 1.1.0
  description: Versioned OpenAPI specification for FiatBridge payout routing, status tracking, and provider reconciliation.
servers:
  - url: https://api.stellar-dex-chat.org/v1
    description: Production Gateway
  - url: https://staging-api.stellar-dex-chat.org/v1
    description: Testnet Staging Gateway
paths:
  /payouts/initiate:
    post:
      summary: Initiate a fiat payout from verified contract deposit
      operationId: initiatePayout
      parameters:
        - name: X-API-Version
          in: header
          required: false
          schema:
            type: string
            enum: [v1, '1']
          description: Payout request/response schema version. Missing or v1 selects the backward-compatible v1 schema.
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Unique client-generated key preventing duplicate payouts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePayoutRequest'
      responses:
        '200':
          description: Payout initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '400':
          description: Validation error or invalid recipient details
        '409':
          description: Idempotency conflict or duplicate payout reference
        '429':
          description: Rate limit exceeded
        '406':
          description: Unsupported payout API schema version

  /payouts/{reference}/status:
    get:
      summary: Get real-time status of payout operation
      operationId: getPayoutStatus
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authoritative payout status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'

  /admin/liability-parity:
    get:
      summary: Compare live on-chain escrow liabilities with persisted payout reservations
      operationId: getEscrowLiabilityParity
      security:
        - AdminToken: []
      parameters:
        - name: asset
          in: query
          required: false
          schema:
            type: string
        - name: receiptId
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: maxPages
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          description: Read-only parity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiabilityParityReport'
        '400':
          description: Invalid pagination parameters
        '401':
          description: Admin authentication required
        '403':
          description: Caller IP is not allowlisted
        '500':
          description: Contract or reservation source unavailable
    post:
      summary: Compare a supplied liability snapshot without mutating state
      operationId: compareEscrowLiabilitySnapshot
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiabilityParityInput'
      responses:
        '200':
          description: Read-only parity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiabilityParityReport'
        '400':
          description: Invalid snapshot body
        '401':
          description: Admin authentication required
        '403':
          description: Caller IP is not allowlisted

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token
  schemas:
    InitiatePayoutRequest:
      type: object
      required:
        - txHash
        - contractId
        - amount
        - currency
        - recipientAccount
        - bankCode
      properties:
        schemaVersion:
          type: string
          enum: [v1]
        apiVersion:
          type: string
          enum: [v1]
        txHash:
          type: string
        contractId:
          type: string
        amount:
          type: string
        currency:
          type: string
          enum: [NGN, USD, EUR]
        recipientAccount:
          type: string
        bankCode:
          type: string

    PayoutResponse:
      type: object
      required:
        - reference
        - status
        - amount
        - currency
        - updatedAt
      properties:
        reference:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, SUCCESS, FAILED, DISPUTED]
        amount:
          type: string
        currency:
          type: string
        providerReference:
          type: string
        updatedAt:
          type: string
          format: date-time

    LiabilityParityInput:
      type: object
      required:
        - liabilities
        - reservations
      properties:
        liabilities:
          type: array
          items:
            $ref: '#/components/schemas/EscrowLiabilityInput'
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/PayoutReservationInput'
        assetAliases:
          type: object
          additionalProperties:
            type: string
        filters:
          type: object
          properties:
            asset:
              type: string
            receiptId:
              type: string
        sourceTruncated:
          type: boolean

    EscrowLiabilityInput:
      type: object
      required:
        - receiptId
        - asset
        - amountMinor
      properties:
        receiptId:
          type: string
        asset:
          type: string
        amountMinor:
          type: string
        status:
          type: string
          enum: [active, migrated, released]

    PayoutReservationInput:
      type: object
      required:
        - payoutId
        - receiptId
        - asset
        - amountMinor
      properties:
        payoutId:
          type: string
        receiptId:
          type: string
        asset:
          type: string
        amountMinor:
          type: string
        status:
          type: string
          enum: [reserved, under_review, settled, released]

    LiabilityParityReport:
      type: object
      required:
        - schemaVersion
        - readOnly
        - correctionsApplied
        - ok
        - totals
        - byAsset
        - byReceipt
        - mismatches
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        readOnly:
          type: boolean
          enum: [true]
        correctionsApplied:
          type: integer
          enum: [0]
        ok:
          type: boolean
        totals:
          type: object
        byAsset:
          type: array
          items:
            type: object
        byReceipt:
          type: array
          items:
            type: object
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/LiabilityParityMismatch'

    LiabilityParityMismatch:
      type: object
      required:
        - key
        - asset
        - receiptId
        - type
        - reason
      properties:
        key:
          type: string
        asset:
          type: string
        receiptId:
          type: string
        payoutIds:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - AMOUNT_MISMATCH
            - MISSING_RESERVATION
            - MISSING_LIABILITY
            - DUPLICATE_RESERVATION
            - INVALID_RECORD
            - SOURCE_TRUNCATED
        onChainMinor:
          type: string
        reservedMinor:
          type: string
        deltaMinor:
          type: string
        reason:
          type: string
